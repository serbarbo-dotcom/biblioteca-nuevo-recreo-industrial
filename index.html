<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18277c">
<title>Biblioteca Nuevo Recreo Industrial</title>
<style>
:root{--azul:#18277c;--granate:#a71351;--dorado:#b59a50;font-family:Arial,sans-serif;color:#26332d;background:#f5f1e8}
*{box-sizing:border-box}body{margin:0}header{background:var(--azul);color:white;border-bottom:5px solid var(--dorado);text-align:center;padding:34px 16px}h1{margin:0 0 12px;font-size:clamp(24px,4vw,38px)}header p{margin:0}main{max-width:1100px;margin:auto;padding:24px 16px}
.toolbar,.actions,.cover-controls,.tabs,.view-controls,.sort-group,.pagination,.batch-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button,textarea{font:inherit;padding:11px;border:1px solid #c7c9c4;border-radius:8px}input{min-width:0}#buscar{flex:1;min-width:210px}button{background:#263e35;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#263e35}button.danger{background:#a42d2d}button:disabled{opacity:.55;cursor:not-allowed}#estado{margin:20px 0;color:#5c645e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.libro{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #0001}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#e2e7e2;display:block}.no-cover{aspect-ratio:2/3;display:grid;place-items:center;background:#dfe7e1;color:#56685d;font-size:48px}.info{padding:15px}.info h3{margin:0 0 9px}.info p{margin:6px 0;font-size:14px}.info details{margin-top:12px}.info summary{cursor:pointer;color:var(--azul);font-weight:bold}.actions button{padding:8px;font-size:13px}
#admin{margin:20px 0;padding:20px;background:white;border-radius:12px}#admin[hidden],#formulario[hidden],[hidden]{display:none!important}#formulario{display:grid;gap:10px;margin-top:14px}#formulario label{display:grid;gap:5px}#formulario input,#formulario textarea{width:100%}.small,.muted{font-size:13px;color:#59635c}#mensaje{color:#a42d2d}a{color:#235e4d}
.tabs{margin:0 0 18px}.tabs button{background:var(--azul);color:white}.tabs button[aria-selected="true"]{background:var(--granate)}.chat-box{background:#fff;border-radius:12px;padding:18px;margin:12px 0}.chat-messages{display:grid;gap:10px;max-height:500px;overflow:auto;padding:12px 0}.chat-message{padding:12px;border-radius:10px;background:#f1f5f1;overflow-wrap:anywhere;border-left:4px solid var(--dorado)}.chat-meta{font-size:12px;color:#54665b;margin-bottom:5px}.chat-compose{display:grid;gap:9px}.chat-compose textarea{width:100%;min-height:75px}.rules-list{line-height:1.75}
.import-panel{margin-top:18px;padding:15px;border:1px solid #d9dfd9;border-radius:10px}.import-panel input{max-width:100%;width:100%}.import-panel button{margin-top:8px}.preview{max-height:220px;overflow:auto;margin-top:10px}.preview table{border-collapse:collapse;width:100%;font-size:13px}.preview td,.preview th{border-bottom:1px solid #ddd;padding:6px;text-align:left}.view-controls{margin:14px 0;background:#fff;padding:12px;border-radius:10px;box-shadow:0 1px 6px #0001}.view-controls label{display:flex;align-items:center;gap:6px}.sort-btn{padding:9px 14px;font-size:14px;background:#fff;color:var(--azul);border:2px solid var(--azul);font-weight:600}.sort-btn[aria-pressed="true"]{background:var(--granate);color:white;border-color:var(--granate)}.pagination{justify-content:center;margin:20px 0}.pagination button{padding:9px 14px}
.grid.list-view{display:flex;flex-direction:column;gap:10px}.list-view .libro{display:flex;align-items:stretch;min-height:90px}.list-view .cover,.list-view .no-cover{width:74px;min-width:74px;height:110px;aspect-ratio:auto;object-fit:cover;font-size:25px}.list-view .info{flex:1;min-width:0;padding:12px}.list-view .info h3{font-size:16px}.list-view .info p{display:inline-block;margin:3px 14px 3px 0}.cover-controls button{font-size:13px;padding:9px}
@media(max-width:450px){.list-view .cover,.list-view .no-cover{width:58px;min-width:58px;height:90px}.list-view .info{padding:9px}}
</style>
</head>
